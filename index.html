<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Reader & Action</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="manifest" href="manifest.json">
	<script>
	  if ('serviceWorker' in navigator) {
	    navigator.serviceWorker.register('sw.js');
	  }
	</script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.2rem; margin-bottom: 16px; color: #333; }
        #reader {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #result-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none; /* 初期状態は非表示 */
        }
        .scanned-text {
            word-break: break-all;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .toast {
            position: fixed;
            bottom: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <h1>QRコードリーダー</h1>
    
    <div id="reader"></div>

    <div id="result-container">
        <h3>読み取り結果</h3>
        <div class="scanned-text" id="scanned-data"></div>
        <div id="action-buttons"></div>
        <button class="btn btn-secondary" onclick="restartScanner()">もう一度スキャンする</button>
    </div>

    <div id="toast" class="toast">クリップボードにコピーしました</div>

<script>
let html5QrcodeScanner;

// 画面読み込み時にカメラを起動
window.addEventListener('DOMContentLoaded', () => {
    startScanner();
});

function startScanner() {
    // スキャナーの初期化設定（背面カメラ優先、1秒間に10フレーム解析）
    html5QrcodeScanner = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrcodeScanner.start(
        { facingMode: "environment" }, // 背面カメラを指定
        config,
        onScanSuccess
    ).catch(err => {
        console.error("カメラの起動に失敗しました:", err);
        alert("カメラへのアクセスを許可してください。");
    });
}

// QRコードの読み取りに成功した時の処理
function onScanSuccess(decodedText, decodedResult) {
    // 成功したら一旦カメラを止める（連続読み取りを防ぐ）
    html5QrcodeScanner.stop().then(() => {
        processResult(decodedText);
    }).catch(err => console.error(err));
}

// 読み取ったデータの仕分けとアクション
function processResult(text) {
    const resultContainer = document.getElementById('result-container');
    const scannedDataEl = document.getElementById('scanned-data');
    const actionButtonsEl = document.getElementById('action-buttons');
    
    // テキストを表示
    scannedDataEl.textContent = text;
    actionButtonsEl.innerHTML = ''; // ボタンエリアをクリア

    // 1. 自動でクリップボードにコピー
    navigator.clipboard.writeText(text).then(() => {
        showToast();
    }).catch(err => {
        console.error('コピー失敗:', err);
    });

    // 2. 内容に応じたボタンの生成
    let hasAction = false;

    // URL（リンク）だった場合
    if (text.startsWith('http://') || text.startsWith('https://')) {
        const linkBtn = document.createElement('a');
        linkBtn.href = text;
        linkBtn.target = '_blank';
        linkBtn.className = 'btn btn-primary';
        linkBtn.textContent = 'ブラウザで開く';
        actionButtonsEl.appendChild(linkBtn);
        hasAction = true;
    }
    // メアドだった場合（あるいは mailto: から始まる場合）
    else if (text.startsWith('mailto:') || text.includes('@') && !text.includes(' ')) {
        const mailHref = text.startsWith('mailto:') ? text : `mailto:${text}`;
        const mailBtn = document.createElement('a');
        mailBtn.href = mailHref;
        mailBtn.className = 'btn btn-success';
        mailBtn.textContent = 'メールを送信する';
        actionButtonsEl.appendChild(mailBtn);
        hasAction = true;
    }

    // 3. 画面の表示切り替え
    document.getElementById('reader').style.display = 'none';
    resultContainer.style.display = 'block';
}

// 再スキャン
function restartScanner() {
    document.getElementById('result-container').style.display = 'none';
    document.getElementById('reader').style.display = 'block';
    startScanner();
}

// トースト通知を表示
function showToast() {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
    }, 2000);
}
</script>
</body>
</html>
