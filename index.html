<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Reader & Action</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#007bff">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.2rem; margin-bottom: 16px; color: #333; }

        #camera-select {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            display: none;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* ズームスライダーのスタイル（追加） */
        #zoom-container {
            width: 100%;
            max-width: 400px;
            margin-top: 12px;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: none;
            text-align: center;
        }
        #zoom-container label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #zoom-slider {
            width: 100%;
            margin: 0;
            cursor: pointer;
        }

        #result-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }
        .scanned-text {
            word-break: break-all;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .toast {
            position: fixed;
            bottom: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <h1>QRコードリーダー</h1>

    <select id="camera-select"></select>

    <div id="reader"></div>

    <div id="zoom-container">
        <label for="zoom-slider">ズーム: <span id="zoom-value">1.0</span>倍</label>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
    </div>

    <div id="result-container">
        <h3>読み取り結果</h3>
        <div class="scanned-text" id="scanned-data"></div>
        <div id="action-buttons"></div>
        <button class="btn btn-secondary" onclick="restartScanner()">もう一度スキャンする</button>
    </div>

    <div id="toast" class="toast">クリップボードにコピーしました</div>

<script>
let html5QrcodeScanner;
let currentCameraId = null;

// 保存するためのキーの名前
const STORAGE_KEY = 'preferred_camera_id';
const ZOOM_STORAGE_KEY = 'preferred_zoom_level'; // ズーム保存用のキーを追加

window.addEventListener('DOMContentLoaded', () => {
    html5QrcodeScanner = new Html5Qrcode("reader");
    initCamera();
});

// カメラ一覧を取得して起動する
function initCamera() {
    Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length > 0) {
            const cameraSelect = document.getElementById('camera-select');
            cameraSelect.style.display = 'block';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.id;
                option.text = device.label || `カメラ ${cameraSelect.length + 1}`;
                cameraSelect.appendChild(option);
            });

            // 1. まず過去に保存したカメラIDがあるかチェック
            const savedCameraId = localStorage.getItem(STORAGE_KEY);

            // 保存されたIDが存在し、現在の端末のカメラ一覧にもあるか確認
            if (savedCameraId && devices.some(d => d.id === savedCameraId)) {
                currentCameraId = savedCameraId;
            } else {
                // 2. なければ「背面」っぽいカメラを探す（初回起動時）
                const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('背面'));
                currentCameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;
            }

            cameraSelect.value = currentCameraId;
            startScanner({ deviceId: { exact: currentCameraId } });

            // カメラを切り替えた時の処理
            cameraSelect.addEventListener('change', (e) => {
                currentCameraId = e.target.value;

                // 選んだカメラIDをブラウザに記憶させる！
                localStorage.setItem(STORAGE_KEY, currentCameraId);

                // カメラ切り替え時は一旦スライダーを隠す
                document.getElementById('zoom-container').style.display = 'none';

                html5QrcodeScanner.stop().then(() => {
                    startScanner({ deviceId: { exact: currentCameraId } });
                }).catch(err => console.error("カメラの切り替えに失敗しました", err));
            });
        } else {
            currentCameraId = { facingMode: "environment" };
            startScanner(currentCameraId);
        }
    }).catch(err => {
        console.error("カメラ取得エラー:", err);
        currentCameraId = { facingMode: "environment" };
        startScanner(currentCameraId);
    });
}

function startScanner(cameraConfig) {
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrcodeScanner.start(
        cameraConfig,
        config,
        onScanSuccess
    ).then(() => {
        // カメラ起動から1秒後に、その端末がズーム対応か調べて初期化する
        setTimeout(() => {
            try {
                const capabilities = html5QrcodeScanner.getRunningTrackCapabilities();
                // 端末がズーム機能（zoom）に対応している場合のみスライダーを出す
                if (capabilities && capabilities.zoom) {
                    const zoomSlider = document.getElementById('zoom-slider');
                    const zoomContainer = document.getElementById('zoom-container');
                    const zoomValue = document.getElementById('zoom-value');

                    // スマホカメラ固有の最小値・最大値・刻み幅を自動セット
                    const minZoom = capabilities.zoom.min || 1;
                    const maxZoom = capabilities.zoom.max || 5;

                    zoomSlider.min = minZoom;
                    zoomSlider.max = maxZoom;
                    zoomSlider.step = capabilities.zoom.step || 0.1;
                    
                    // 保存されているズーム倍率があれば取得し、範囲内に収める
                    const savedZoom = localStorage.getItem(ZOOM_STORAGE_KEY);
                    let targetZoom = savedZoom ? parseFloat(savedZoom) : minZoom;
                    targetZoom = Math.max(minZoom, Math.min(maxZoom, targetZoom));

                    zoomSlider.value = targetZoom;
                    zoomValue.textContent = targetZoom.toFixed(1);

                    // 保存されたズーム倍率をカメラに適用
                    html5QrcodeScanner.applyVideoConstraints({
                        advanced: [{ zoom: targetZoom }]
                    }).catch(err => console.error("初期ズーム適用失敗:", err));

                    // スライダーを表示
                    zoomContainer.style.display = 'block';

                    // スライダーを動かした時の処理
                    zoomSlider.oninput = (e) => {
                        const val = parseFloat(e.target.value);
                        zoomValue.textContent = val.toFixed(1);

                        // ズーム倍率をlocalStorageに保存
                        localStorage.setItem(ZOOM_STORAGE_KEY, val);

                        html5QrcodeScanner.applyVideoConstraints({
                            advanced: [{ zoom: val }]
                        }).catch(err => console.error("ズーム適用失敗:", err));
                    };
                }
            } catch (err) {
                console.log("このブラウザ・端末は詳細なカメラ制御に非対応です", err);
            }
        }, 1000);
    }).catch(err => {
        console.error("カメラの起動に失敗しました:", err);
    });
}

function onScanSuccess(decodedText, decodedResult) {
    html5QrcodeScanner.stop().then(() => {
        processResult(decodedText);
    }).catch(err => console.error(err));
}

function processResult(text) {
    // 結果画面が出たらスライダーは隠す
    document.getElementById('zoom-container').style.display = 'none';

    const resultContainer = document.getElementById('result-container');
    const scannedDataEl = document.getElementById('scanned-data');
    const actionButtonsEl = document.getElementById('action-buttons');

    scannedDataEl.textContent = text;
    actionButtonsEl.innerHTML = '';

    navigator.clipboard.writeText(text).then(() => {
        showToast();
    }).catch(err => console.error('コピー失敗:', err));

    if (text.startsWith('http://') || text.startsWith('https://')) {
        const linkBtn = document.createElement('a');
        linkBtn.href = text;
        linkBtn.target = '_blank';
        linkBtn.className = 'btn btn-primary';
        linkBtn.textContent = 'ブラウザで開く';
        actionButtonsEl.appendChild(linkBtn);
    }
    else if (text.startsWith('mailto:') || text.includes('@') && !text.includes(' ')) {
        const mailHref = text.startsWith('mailto:') ? text : `mailto:${text}`;
        const mailBtn = document.createElement('a');
        mailBtn.href = mailHref;
        mailBtn.className = 'btn btn-success';
        mailBtn.textContent = 'メールを送信する';
        actionButtonsEl.appendChild(mailBtn);
    }

    document.getElementById('reader').style.display = 'none';
    document.getElementById('camera-select').style.display = 'none';
    resultContainer.style.display = 'block';
}

function restartScanner() {
    // 再起動時は一旦スライダーを隠す
    document.getElementById('zoom-container').style.display = 'none';
    document.getElementById('result-container').style.display = 'none';
    document.getElementById('reader').style.display = 'block';

    const configToStart = typeof currentCameraId === 'object'
        ? currentCameraId
        : { deviceId: { exact: currentCameraId } };

    startScanner(configToStart);
    document.getElementById('camera-select').style.display = 'block';
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
    }, 2000);
}
</script>
</body>
</html>
